# These are the long-lived cloud and registry credentials an agent grabs to
# pivot off the box: AWS access keys, gcloud ADC and legacy credential stores,
# the kubeconfig client cert, Azure token caches, the Docker registry auth
# blob, .netrc, and the in-pod Kubernetes service account token. Every needle
# is a credential file path, never a settings file - ~/.aws/config,
# ~/.kube/cache and a repo's own config.json are deliberately excluded, and
# bare 'kubeconfig' was left out so a legitimate 'helm --kubeconfig ...'
# deploy does not trip it. .kube/config was removed from this list because
# kubectl names it on every command via --kubeconfig; that case is handled by
# aileron-114.
id: aileron-111
title: Agent read a cloud or service credential file
severity: high
match:
  type: tool_call
  tool.arguments_contains:
    - ".aws/credentials"
    - "application_default_credentials.json"
    - ".config/gcloud/credentials"
    - ".config/gcloud/legacy_credentials"
    - ".netrc"
    - ".docker/config.json"
    - ".azure/accessTokens.json"
    - "msal_token_cache"
    - "serviceaccount/token"
action: alert
