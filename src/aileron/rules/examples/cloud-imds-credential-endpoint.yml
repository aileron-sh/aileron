# These are the specific metadata paths that hand back live credentials rather
# than harmless instance facts: the EC2 instance profile path, the GCP service
# account token path, the Azure managed identity token endpoint, and the ECS
# and App Service container credential variables. It also catches the IMDSv2
# token header, which an attacker must request first on a hardened host. Left
# as alert because engineers do curl these paths when debugging a broken
# instance role.
id: aileron-121
title: Alert when a tool call targets a cloud metadata credential or identity token endpoint
severity: critical
match:
  type: tool_call
  tool.arguments_contains:
    - "iam/security-credentials"
    - "computeMetadata/v1/instance/service-accounts"
    - "/metadata/identity/oauth2/token"
    - "aws-ec2-metadata-token"
    - "AWS_CONTAINER_CREDENTIALS_RELATIVE_URI"
    - "AWS_CONTAINER_CREDENTIALS_FULL_URI"
    - "MSI_ENDPOINT"
action: alert
