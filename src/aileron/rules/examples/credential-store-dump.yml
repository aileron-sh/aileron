# This is infostealer behaviour: copying Chrome's Login Data or Cookies DB,
# Firefox's logins.json plus key4.db, dumping the macOS keychain, or reading
# /etc/shadow. The browser needles are gated on a vendor name within 120
# characters of the file name so a repo fixture called logins.json or a
# src/lib/cookies.ts does not fire, and /etc/shadow is matched with its full
# path so the flood of CSS box-shadow hits is avoided. Kept at alert, not
# block, because browser-automation agents sometimes reuse a real profile's
# cookie store on purpose.
id: aileron-112
title: Agent read a browser password store, OS keychain, or shadow file
severity: critical
match:
  type: tool_call
  tool.arguments_regex: '(?i)(/etc/shadow|cookies\.sqlite|key[34]\.db|login\.keychain|dump-keychain|find-(generic|internet)-password|(mozilla|firefox)[^"]{0,120}logins\.json|(chrome|chromium|brave)[^"]{0,120}(login data|cookies))'
action: alert
