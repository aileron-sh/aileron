# The kubeconfig carries a cluster client certificate. Reading the file is
# credential collection; passing it to kubectl is not.
id: aileron-114
title: Kubeconfig read outside a kubectl invocation
severity: high
match:
  type: tool_call
  # kubectl names this file constantly via --kubeconfig, which is normal. What
  # is not normal is reading the file itself, since it carries a client cert.
  tool.arguments_regex: '(?i)^(?!.*--kubeconfig).*\.kube/config'
action: alert
