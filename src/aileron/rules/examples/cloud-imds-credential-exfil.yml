# This is the two condition version of rule 121: the tool call must both touch
# a metadata endpoint that returns credentials and push the result into a
# network sink (a pipe to curl, wget, nc or socat, a POST or upload body,
# /dev/tcp, or requests.post). Reading instance role credentials is
# debuggable, but sending them off the host is not, so this one is worth
# blocking before execution. Reading the same endpoint and piping to jq stays
# out of scope and only alerts via rule 121.
id: aileron-122
title: Block cloud metadata credentials being piped or posted to a network sink
severity: critical
match:
  type: tool_call
  tool.arguments_contains:
    - "iam/security-credentials"
    - "computeMetadata/v1/instance/service-accounts"
    - "/metadata/identity/oauth2/token"
    - "AWS_CONTAINER_CREDENTIALS_RELATIVE_URI"
    - "AWS_CONTAINER_CREDENTIALS_FULL_URI"
    - "169.254.170.2"
  tool.arguments_regex: '(?i)(\|\s{0,4}(curl|wget|nc|ncat|socat|http)\b|--data\b|--upload-file\b|-T\s|-d\s|-X\s{0,4}POST|/dev/tcp/|requests\.post)'
action: block
