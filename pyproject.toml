[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aileron"
version = "0.1.5"
description = "Flight recorder for AI agents: tamper-evident audit logging, policy enforcement, and incident reports"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Kamal Lohchab", email = "kamal.lohchab@yahoo.com" }]
keywords = ["ai-agents", "security", "audit", "mcp", "tamper-evident", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
dependencies = [
    "pyyaml",
    "cryptography",
]

[project.urls]
Homepage = "https://github.com/aileron-sh/aileron"
Repository = "https://github.com/aileron-sh/aileron"
Changelog = "https://github.com/aileron-sh/aileron/blob/main/CHANGELOG.md"
Security = "https://github.com/aileron-sh/aileron/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
aileron = "aileron.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aileron = ["py.typed", "rules/examples/*.yml", "rules/examples/*.md"]
